name: CI/CD - Student Marks App

# TRIGGER: Inafanya kazi kila push kwa main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ── STEP 1 ──────────────────────────────────
      # Chukua code yako kutoka GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # ── STEP 2 ──────────────────────────────────
      # Angalia muundo wa project
      - name: Check project structure
        run: |
          echo "Files ndani ya project:"
          ls -la
          echo ""
          echo "Frontend files:"
          ls -la frontend/
          echo ""
          echo "Backend files:"
          ls -la backend/

      # ── STEP 3 ──────────────────────────────────
      # Weka Node.js kwa backend
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # ── STEP 4 ──────────────────────────────────
      # Install mongodb package
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          echo "npm install OK!"

      # ── STEP 5 ──────────────────────────────────
      # Build Docker images (frontend + backend + database)
      - name: Build Docker images
        run: |
          docker compose -f compose.yml build
          echo "Build complete!"
          docker images

      # ── STEP 6 ──────────────────────────────────
      # Anza containers zote kwa background
      - name: Start all containers
        run: |
          docker compose -f compose.yml up -d
          echo "Containers started!"

      # ── STEP 7 ──────────────────────────────────
      # Subiri sekunde 25 containers zianze vizuri
      - name: Wait for containers to be ready
        run: |
          echo "Nasubiri containers zianze..."
          sleep 25
          echo "Containers ziko tayari!"

      # ── STEP 8 ──────────────────────────────────
      # Onyesha containers zinazofanya kazi
      - name: Show running containers
        run: docker compose -f compose.yml ps

      # ── STEP 9 ──────────────────────────────────
      # Test frontend inajibu
      - name: Test frontend
        run: |
          echo "Najaribu frontend..."
          curl -f http://localhost:8080
          echo "FRONTEND INAJIBU - OK!"

      # ── STEP 10 ─────────────────────────────────
      # Test backend inajibu
      - name: Test backend
        run: |
          echo "Najaribu backend..."
          curl -f http://localhost:3000/api
          echo "BACKEND INAJIBU - OK!"

      # ── STEP 11 ─────────────────────────────────
      # Test POST - jaribu kuadd student
      - name: Test student submission
        run: |
          echo "Najaribu kuadd student wa test..."
          curl -f -X POST http://localhost:3000/api \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test Student","subject":"DevOps","marks":99,"grade":"A"}'
          echo "POST IMEFANYA KAZI - OK!"

      # ── STEP 12 ─────────────────────────────────
      # Kama kuna error - onyesha logs
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== FRONTEND LOGS ==="
          docker compose -f compose.yml logs frontend
          echo "=== BACKEND LOGS ==="
          docker compose -f compose.yml logs backend

      # ── STEP 13 ─────────────────────────────────
      # Safisha containers baada ya test
      - name: Cleanup
        if: always()
        run: |
          docker compose -f compose.yml down
          echo "Cleanup done!"
