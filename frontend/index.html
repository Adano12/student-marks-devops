<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Marks Submission</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f0f3f8;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:430px;
      background:white;
      border-radius:16px;
      padding:30px;
      box-shadow:0 4px 20px rgba(0,0,0,0.08);
      border:1px solid #dce3f0;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:25px;
      padding-bottom:18px;
      border-bottom:2px solid #f5c842;
    }

    .logo-icon{
      width:45px;
      height:45px;
      border-radius:10px;
      background:#0f1e3c;
      color:#f5c842;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:bold;
      font-size:22px;
    }

    .logo h1{
      font-size:18px;
      color:#0f1e3c;
    }

    .logo p{
      font-size:12px;
      color:#6b7a99;
      margin-top:2px;
    }

    .form-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size:11px;
      font-weight:bold;
      color:#6b7a99;
      text-transform:uppercase;
    }

    input,
    select{
      width:100%;
      padding:11px 14px;
      border:1.5px solid #dce3f0;
      border-radius:9px;
      background:#f8faff;
      font-size:14px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#0f1e3c;
      background:white;
    }

    .auth-buttons{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .btn{
      flex:1;
      border:none;
      background:#0f1e3c;
      color:white;
      padding:12px;
      border-radius:9px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    .btn:hover{
      background:#1a2f57;
    }

    .btn:disabled{
      opacity:0.7;
      cursor:not-allowed;
    }

    .divider{
      margin:22px 0;
      border:none;
      border-top:1px solid #dce3f0;
    }

    .grade-preview{
      display:flex;
      align-items:center;
      gap:12px;
      background:#f8faff;
      border:1.5px solid #dce3f0;
      padding:12px;
      border-radius:10px;
    }

    .grade-box{
      width:40px;
      height:40px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:18px;
    }

    .g-empty{
      background:#eef2f7;
      color:#94a3b8;
    }

    .g-A{
      background:#dcfce7;
      color:#15803d;
    }

    .g-B{
      background:#dbeafe;
      color:#1d4ed8;
    }

    .g-C{
      background:#fef9c3;
      color:#854d0e;
    }

    .g-D{
      background:#ffedd5;
      color:#c2410c;
    }

    .g-F{
      background:#fee2e2;
      color:#b91c1c;
    }

    .grade-info strong{
      display:block;
      font-size:14px;
      color:#1a1a2e;
    }

    .grade-info span{
      font-size:12px;
      color:#6b7a99;
    }

    #authMessage{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      font-weight:bold;
      color:#0f1e3c;
    }

    .success-view{
      display:none;
      text-align:center;
    }

    .success-circle{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#dcfce7;
      color:#15803d;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:auto;
      font-size:30px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .success-detail{
      background:#f8faff;
      border:1px solid #dce3f0;
      border-radius:10px;
      padding:15px;
      margin:20px 0;
      text-align:left;
      line-height:1.8;
      font-size:14px;
    }

    .footer-note{
      text-align:center;
      margin-top:18px;
      font-size:12px;
      color:#94a3b8;
    }

  </style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="logo">

    <div class="logo-icon">S</div>

    <div>
      <h1>Student Marks Submission</h1>
      <p>Results reviewed by admin only</p>
    </div>

  </div>

  <!-- FORM VIEW -->
  <div id="form-view">

    <!-- AUTH -->

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <div class="auth-buttons">

      <button class="btn" onclick="signup()">
        Signup
      </button>

      <button class="btn" onclick="login()">
        Login
      </button>

    </div>

    <p id="authMessage"></p>

    <hr class="divider">

    <!-- STUDENT FORM -->

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="e.g. Adano Katelo">
    </div>

    <div class="form-group">

      <label>Subject</label>

      <select id="subject">
        <option value="">-- Select Subject --</option>
        <option>Mathematics</option>
        <option>English</option>
        <option>Kiswahili</option>
        <option>Science</option>
        <option>History</option>
        <option>Geography</option>
        <option>Computer Studies</option>
        <option>Business Studies</option>
      </select>

    </div>

    <div class="form-group">

      <label>Marks (0 - 100)</label>

      <input
        type="number"
        id="marks"
        min="0"
        max="100"
        placeholder="e.g. 78"
        oninput="previewGrade()"
      >

    </div>

    <div class="form-group">

      <label>Grade (Auto-calculated)</label>

      <div class="grade-preview">

        <div class="grade-box g-empty" id="grade-box">
          --
        </div>

        <div class="grade-info">
          <strong id="grade-letter">Waiting...</strong>
          <span id="grade-desc">Enter marks to see grade</span>
        </div>

      </div>

    </div>

    <hr class="divider">

    <button
      class="btn"
      id="submit-btn"
      onclick="submitStudent()"
    >
      Submit Marks
    </button>

  </div>

  <!-- SUCCESS -->

  <div class="success-view" id="success-view">

    <div class="success-circle">✓</div>

    <h2>Submitted Successfully!</h2>

    <br>

    <p>Your marks have been saved.</p>

    <div class="success-detail" id="success-detail"></div>

    <button class="btn" onclick="resetForm()">
      Submit Another
    </button>

  </div>

</div>

<script>

const API = "/api";

// =====================
// SIGNUP
// =====================

async function signup() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if (!username || !password) {

    alert("Enter username and password");
    return;
  }

  try {

    const res = await fetch(API + "/signup", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        password
      })
    });

    const data = await res.json();

    document.getElementById("authMessage")
      .innerText = data.message;

  } catch(err) {

    console.log(err);

    document.getElementById("authMessage")
      .innerText = "Signup failed";
  }
}

// =====================
// LOGIN
// =====================

async function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if (!username || !password) {

    alert("Enter username and password");
    return;
  }

  try {

    const res = await fetch(API + "/login", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        password
      })
    });

    const data = await res.json();

    if (data.token) {

      localStorage.setItem("token", data.token);

      document.getElementById("authMessage")
        .innerText = "Login successful 🔥";

    } else {

      document.getElementById("authMessage")
        .innerText = data.message;
    }

  } catch(err) {

    console.log(err);

    document.getElementById("authMessage")
      .innerText = "Login failed";
  }
}

// =====================
// GRADE
// =====================

function calcGrade(marks){

  if(marks >= 80)
    return {letter:"A",desc:"Excellent",cls:"g-A"};

  if(marks >= 60)
    return {letter:"B",desc:"Good",cls:"g-B"};

  if(marks >= 40)
    return {letter:"C",desc:"Average",cls:"g-C"};

  if(marks >= 20)
    return {letter:"D",desc:"Below Average",cls:"g-D"};

  return {letter:"F",desc:"Fail",cls:"g-F"};
}

function previewGrade(){

  const marks =
    parseInt(document.getElementById("marks").value);

  const box =
    document.getElementById("grade-box");

  const letter =
    document.getElementById("grade-letter");

  const desc =
    document.getElementById("grade-desc");

  if(isNaN(marks) || marks < 0 || marks > 100){

    box.className = "grade-box g-empty";
    box.innerText = "--";

    letter.innerText = "Waiting...";
    desc.innerText = "Enter marks to see grade";

    return;
  }

  const grade = calcGrade(marks);

  box.className = "grade-box " + grade.cls;
  box.innerText = grade.letter;

  letter.innerText = "Grade " + grade.letter;
  desc.innerText = grade.desc + " (" + marks + "/100)";
}

// =====================
// SUBMIT
// =====================

async function submitStudent(){

  const token = localStorage.getItem("token");

  if(!token){

    alert("Please login first");
    return;
  }

  const name =
    document.getElementById("name").value.trim();

  const subject =
    document.getElementById("subject").value;

  const marks =
    parseInt(document.getElementById("marks").value);

  if(!name)
    return alert("Enter student name");

  if(!subject)
    return alert("Select subject");

  if(isNaN(marks) || marks < 0 || marks > 100)
    return alert("Invalid marks");

  const grade = calcGrade(marks).letter;

  const btn =
    document.getElementById("submit-btn");

  btn.disabled = true;
  btn.innerText = "Submitting...";

  try {

    const res = await fetch(API + "/students", {

      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
      },

      body:JSON.stringify({
        name,
        subject,
        marks,
        grade
      })
    });

    const data = await res.json();

    if(!res.ok){

      alert(data.message || "Submission failed");
      return;
    }

    document.getElementById("form-view")
      .style.display = "none";

    document.getElementById("success-view")
      .style.display = "block";

    document.getElementById("success-detail")
      .innerHTML =

      "<strong>Name:</strong> " + name + "<br>" +
      "<strong>Subject:</strong> " + subject + "<br>" +
      "<strong>Marks:</strong> " + marks + "<br>" +
      "<strong>Grade:</strong> " + grade;

  } catch(err){

    console.log(err);

    alert("Submission failed");

  } finally {

    btn.disabled = false;
    btn.innerText = "Submit Marks";
  }
}

// =====================
// RESET
// =====================

function resetForm(){

  document.getElementById("name").value = "";
  document.getElementById("subject").value = "";
  document.getElementById("marks").value = "";

  previewGrade();

  document.getElementById("form-view")
    .style.display = "block";

  document.getElementById("success-view")
    .style.display = "none";
}

</script>

</body>
</html>
