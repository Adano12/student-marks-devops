server {
  listen 80;
  charset utf-8;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Type "text/html; charset=utf-8";
  }

  location /api {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}